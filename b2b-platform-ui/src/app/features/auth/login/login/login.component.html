<div class="login-page">

  <div class="login-shell">

    <div class="brand">
      <div class="brand-mark">S</div>

      <div>
        <strong>SupplyDesk</strong>
        <span>B2B Sales Workspace</span>
      </div>
    </div>

    <div class="login-card">

      <div class="login-heading">
        <span class="eyebrow">Welcome back</span>

        <h1>Sign in</h1>

        <p>
          Access your sales workspace and manage your business.
        </p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@company.com"
            autocomplete="email"
          />

          <small
            *ngIf="
              form.controls.email.touched &&
              form.controls.email.invalid
            "
          >
            Enter a valid email address.
          </small>

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />

        </div>

        <div
          class="login-error"
          *ngIf="error"
        >
          {{ error }}
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="loading"
        >
          <span *ngIf="!loading">
            Sign in
          </span>

          <span *ngIf="loading">
            Signing in...
          </span>
        </button>

      </form>

    </div>

    <p class="login-footer">
      © {{ 2026 }} SupplyDesk
    </p>

  </div>

</div>
