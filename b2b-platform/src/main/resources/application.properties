spring.application.name=b2b-platform
server.port=${PORT:8080}

# Local development defaults. Override with environment variables in Docker/AWS.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Development seed data: run data.sql after Hibernate creates/updates the schema.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.issuer=b2b-platform

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPEN_AI_MODEL}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=true
springdoc.packages-to-scan=com.b2b.b2b_platform